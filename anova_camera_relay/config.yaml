name: Anova Camera Relay
version: "1.21.2-2"
slug: anova_camera_relay
description: >-
  MediaMTX relay that lets the Anova Ovens integration read the
  oven camera (VP8 over WebRTC) as RTSP
url: https://github.com/rawmediaau/anova-ovens
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
# No ports are published on the host: Home Assistant reaches the relay on
# the internal Supervisor network by the app's hostname.
options: {}
schema: {}
